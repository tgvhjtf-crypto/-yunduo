        precision highp float;
        #else
        precision mediump float;
        #endif
        uniform samplerExternalOES sTex;
        uniform float uBrightness;
        uniform float uContrast;
        uniform float uSaturation;
        uniform float uWarmth;
        uniform float uSharp;
        uniform vec2 uTexel;
        varying vec2 vUV;
        void main() {
