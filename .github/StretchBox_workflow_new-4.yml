                AppLog.i("Svc", "bind：服务已连接，跳过")
                return
            }
            if (binding) {
                AppLog.i("Svc", "bind：正在绑定中，等待回调")
                return
            }
            val st = status()
            if (st != Status.READY) {
                AppLog.w("Svc", "bind：状态=$st，不是 READY，跳过")
                return
            }
            binding = true
            val a = Shizuku.UserServiceArgs(ComponentName(ctx.packageName, StretchService::class.java.name))
                .daemon(false)               // App 退出时 shell 进程一并退出，虚拟屏随之回收
                .processNameSuffix("stretch")
                .version(SERVICE_VERSION)
            args = a
            AppLog.i("Svc", "bindUserService 开始（服务版本 $SERVICE_VERSION，Shizuku v${serverVersion()}，${runMode()}）")
            try {
