                val sm = Class.forName("android.os.ServiceManager")
                val get = sm.getMethod("getService", String::class.java)
                var binder: IBinder? = null
                var attempts = 0
                while (binder == null && attempts < 20) {
                    binder = get.invoke(null, RootMain.SERVICE_NAME) as? IBinder
                    if (binder == null) Thread.sleep(300)
                    attempts++
                }
                if (binder == null || !binder.pingBinder()) {
                    val avail = try { p.inputStream.available() } catch (_: Throwable) { 0 }
                    val out = if (avail > 0) {
                        val buf = ByteArray(minOf(avail, 800))
                        val n = p.inputStream.read(buf)
                        String(buf, 0, maxOf(n, 0))
                    } else ""
                    log.e("RootSvc", "找不到 root 服务（尝试 $attempts 次，root 进程存活=${p.isAlive}）。常见原因：系统的 SELinux 不允许应用访问自定义服务。输出=$out")
                    p.destroy()
                    fail("应用访问不到 root 服务，多半是系统 SELinux 拦截")
                    return@thread
                }
                val s = IStretchService.Stub.asInterface(binder)
                service = s
                log.i("RootSvc", "root 服务已连接")
                waiters.forEach { it(s) }
                waiters.clear()
                onConnectionChanged?.invoke()
            } catch (t: Throwable) {
                log.e("RootSvc", "root 服务启动异常", t)
                fail("启动异常 ${t.javaClass.simpleName}")
            }
        }
            }

            /** 服务已连接就立即回调，否则排队等待 */
            fun whenReady(cb: (IStretchService) -> Unit) {
        val s = service
        if (s != null) cb(s) else waiters.add(cb)
            }
        }
