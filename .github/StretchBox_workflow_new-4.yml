        package com.example.stretchbox.util

        import android.content.Context
        import java.util.Locale

        /** 帧率记录：游戏容器运行期间每秒采样一次帧率和电池温度，关闭时汇总并保存，在“概览”页查看 */
        object FpsRecorder {
            private val samples = ArrayList<Int>()
            private val temps = ArrayList<Float>()
            private var pkg = ""

            @Synchronized
            fun start(p: String) {
                samples.clear()
                temps.clear()
                pkg = p
            }

            @Synchronized
            fun sample(fps: Int, temp: Float = 0f) {
                if (fps > 0 && samples.size < 20000) {
                    samples.add(fps)
                    temps.add(temp)
                }
            }

            @Synchronized
            fun finish(ctx: Context) {
                if (samples.size < 3) return
                val avg = samples.average()
                val mn = samples.minOrNull() ?: 0
                val mx = samples.maxOrNull() ?: 0
                val sorted = samples.sorted()
                val low = sorted.take(maxOf(1, sorted.size / 20)).average()
                val stable = samples.count { it >= avg * 0.9 } * 100 / samples.size
                val text = "游戏 $pkg\n时长 ${samples.size} 秒\n平均 %.1f · 最低 $mn · 最高 $mx\n5%%低帧 %.1f · 稳定度 $stable%%".format(avg, low)
                ctx.applicationContext.getSharedPreferences("fpsrec", Context.MODE_PRIVATE).edit()
                    .putString("last", text)
                    .putString("series_fps", encode(samples.map { it.toFloat() }))
                    .putString("series_temp", encode(temps))
                    .apply()
                AppLog.i("FPS", text.replace("\n", " | "))
            }

            fun last(ctx: Context): String? =
                ctx.applicationContext.getSharedPreferences("fpsrec", Context.MODE_PRIVATE).getString("last", null)

            /** 上一次游戏的曲线数据（帧率, 电池温度）；没有则 null */
            fun series(ctx: Context): Pair<List<Float>, List<Float>>? {
                val sp = ctx.applicationContext.getSharedPreferences("fpsrec", Context.MODE_PRIVATE)
                fun decode(k: String) = (sp.getString(k, "") ?: "").split(",").mapNotNull { it.toFloatOrNull() }
                val f = decode("series_fps")
                val t = decode("series_temp")
                return if (f.size >= 2) f to t else null
            }

            /** 最多保留 240 个点：按桶取平均 */
            private fun encode(v: List<Float>): String {
                if (v.isEmpty()) return ""
                val n = minOf(240, v.size)
                val out = ArrayList<Float>(n)
                for (i in 0 until n) {
                    val a = i * v.size / n
                    val b = maxOf(a + 1, (i + 1) * v.size / n)
                    out.add(v.subList(a, b).average().toFloat())
                }
                return out.joinToString(",") { String.format(Locale.US, "%.1f", it) }
            }
        }
        STRETCH_EOF
