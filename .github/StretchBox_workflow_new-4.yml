        package com.example.stretchbox.util

        import android.app.Notification
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.content.Context
        import android.os.Handler
        import android.os.Looper
        import android.os.SystemClock
        import android.widget.Toast

        /** 过热提醒：电池温度超过设定值时通知 + Toast，3 分钟内不重复 */
        object HeatAlert {
            private var lastAt = 0L

            fun check(ctx: Context, temp: Float, limit: Int) {
                val now = SystemClock.elapsedRealtime()
                if (lastAt != 0L && now - lastAt < 180_000) return
                lastAt = now
                val t = "%.1f".format(temp)
                AppLog.w("Heat", "电池温度 ${t}℃ 已达到提醒值 ${limit}℃")
                try {
                    val nm = ctx.getSystemService(NotificationManager::class.java)
                    nm.createNotificationChannel(NotificationChannel("alert", "过热提醒", NotificationManager.IMPORTANCE_HIGH))
                    val n = Notification.Builder(ctx, "alert")
                        .setSmallIcon(android.R.drawable.ic_dialog_alert)
                        .setContentTitle("手机温度偏高：${t}℃")
                        .setContentText("建议降低增强分辨率或帧率，或让手机休息一下")
                        .setAutoCancel(true)
                        .build()
                    nm.notify(7002, n)
                } catch (_: Throwable) {}
                Handler(Looper.getMainLooper()).post {
                    Toast.makeText(ctx.applicationContext, "手机温度偏高：${t}℃", Toast.LENGTH_LONG).show()
                }
            }
        }
