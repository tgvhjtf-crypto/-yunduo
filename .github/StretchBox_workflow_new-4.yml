        import android.os.Build
        import androidx.compose.material3.ColorScheme
        import androidx.compose.material3.MaterialTheme
        import androidx.compose.material3.darkColorScheme
        import androidx.compose.material3.dynamicDarkColorScheme
        import androidx.compose.material3.dynamicLightColorScheme
        import androidx.compose.material3.lightColorScheme
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.platform.LocalContext

        // 浅色：主色白色；深色：近黑底（可选纯黑 AMOLED）。辅色：莫奈取色或手动选色。
        private val Ink = Color(0xFF1B1B1F)
        private val DarkBg = Color(0xFF121212)
        private val DarkInk = Color(0xFFE6E6E6)

        private fun hsv(h: Float, s: Float, v: Float): Color =
            Color(android.graphics.Color.HSVToColor(floatArrayOf(h, s.coerceIn(0f, 1f), v.coerceIn(0f, 1f))))

        private fun accentLight(hue: Float, sat: Float): ColorScheme {
            val h = hue.coerceIn(0f, 360f)
            val s = sat.coerceIn(0.1f, 1f)
            return lightColorScheme(
                primary = hsv(h, s, 0.55f),
                onPrimary = Color.White,
                primaryContainer = hsv(h, s * 0.25f, 1f),
                onPrimaryContainer = hsv(h, s, 0.2f),
                secondary = hsv(h, s * 0.7f, 0.5f),
                onSecondary = Color.White,
                secondaryContainer = hsv(h, s * 0.15f, 1f),
                onSecondaryContainer = hsv(h, s, 0.2f),
                tertiary = hsv((h + 40f) % 360f, s * 0.8f, 0.5f),
                onTertiary = Color.White,
                tertiaryContainer = hsv((h + 40f) % 360f, s * 0.2f, 1f),
                onTertiaryContainer = hsv((h + 40f) % 360f, s, 0.2f),
                background = Color.White,
                onBackground = Ink,
                surface = Color.White,
                onSurface = Ink,
                surfaceVariant = hsv(h, s * 0.1f, 0.92f),
                onSurfaceVariant = Color(0xFF444448),
                outline = Color(0xFF7A7A80),
                surfaceContainerLowest = Color.White,
                surfaceContainerLow = hsv(h, s * 0.05f, 0.975f),
                surfaceContainer = hsv(h, s * 0.08f, 0.955f),
                surfaceContainerHigh = hsv(h, s * 0.10f, 0.935f),
                surfaceContainerHighest = hsv(h, s * 0.12f, 0.915f),
            )
        }

        private fun accentDark(hue: Float, sat: Float, amoled: Boolean): ColorScheme {
            val h = hue.coerceIn(0f, 360f)
            val s = sat.coerceIn(0.1f, 1f)
            val bg = if (amoled) Color.Black else DarkBg
            return darkColorScheme(
                primary = hsv(h, s * 0.55f, 0.95f),
                onPrimary = hsv(h, s, 0.15f),
                primaryContainer = hsv(h, s, 0.35f),
                onPrimaryContainer = hsv(h, s * 0.2f, 1f),
                secondary = hsv(h, s * 0.4f, 0.85f),
                onSecondary = hsv(h, s, 0.15f),
                secondaryContainer = hsv(h, s * 0.6f, 0.3f),
                onSecondaryContainer = hsv(h, s * 0.2f, 0.95f),
                tertiary = hsv((h + 40f) % 360f, s * 0.5f, 0.9f),
                onTertiary = hsv((h + 40f) % 360f, s, 0.15f),
                tertiaryContainer = hsv((h + 40f) % 360f, s * 0.7f, 0.3f),
                onTertiaryContainer = hsv((h + 40f) % 360f, s * 0.2f, 0.95f),
                background = bg,
                onBackground = DarkInk,
                surface = bg,
                onSurface = DarkInk,
                surfaceVariant = Color(0xFF2A2A2E),
                onSurfaceVariant = Color(0xFFC4C4CA),
                outline = Color(0xFF8E8E94),
                surfaceContainerLowest = if (amoled) Color.Black else Color(0xFF0C0C0C),
                surfaceContainerLow = if (amoled) Color(0xFF0E0E10) else Color(0xFF1A1A1C),
                surfaceContainer = if (amoled) Color(0xFF151517) else Color(0xFF1E1E21),
                surfaceContainerHigh = Color(0xFF28282B),
                surfaceContainerHighest = Color(0xFF323235),
            )
        }

        @Composable
        fun StretchTheme(
            monet: Boolean = true,
            hue: Float = 150f,
            sat: Float = 0.6f,
            dark: Boolean = false,
            amoled: Boolean = false,
            content: @Composable () -> Unit,
        ) {
            val ctx = LocalContext.current
            val useMonet = monet && Build.VERSION.SDK_INT >= Build.VERSION_CODES.S
            val colors = when {
                useMonet && dark -> {
                    val d = dynamicDarkColorScheme(ctx)
                    if (amoled) d.copy(background = Color.Black, surface = Color.Black, surfaceContainerLowest = Color.Black) else d
                }
                useMonet -> dynamicLightColorScheme(ctx).copy(
                    background = Color.White,
                    surface = Color.White,
                    onBackground = Ink,
                    onSurface = Ink,
                    surfaceContainerLowest = Color.White,
                )
                dark -> accentDark(hue, sat, amoled)
                else -> accentLight(hue, sat)
            }
            MaterialTheme(colorScheme = colors, content = content)
        }
