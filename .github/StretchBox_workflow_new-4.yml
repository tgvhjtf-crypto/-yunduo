        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.Path
        import androidx.compose.ui.graphics.StrokeCap
        import androidx.compose.ui.graphics.StrokeJoin
        import androidx.compose.ui.graphics.drawscope.Stroke
        import androidx.compose.ui.unit.dp

        /** 简单折线图：标题 + 最低/最高值 + 三条参考线 + 曲线 */
        @Composable
        fun LineChart(title: String, values: List<Float>, color: Color, modifier: Modifier = Modifier) {
            if (values.size < 2) return
            val mn = values.minOrNull() ?: 0f
            val mx = values.maxOrNull() ?: 0f
            val grid = MaterialTheme.colorScheme.outlineVariant
            Column(modifier.padding(horizontal = 20.dp, vertical = 6.dp)) {
                Row {
                    Text(title, style = MaterialTheme.typography.labelLarge, modifier = Modifier.weight(1f))
                    Text(
                        "最低 %.1f · 最高 %.1f".format(mn, mx),
                        style = MaterialTheme.typography.labelMedium,
                        color = MaterialTheme.colorScheme.onSurfaceVariant,
                    )
                }
                Canvas(Modifier.fillMaxWidth().height(90.dp).padding(top = 6.dp)) {
                    val w = size.width
                    val h = size.height
                    val span = (mx - mn).coerceAtLeast(1f)
                    for (i in 0..2) {
                        val y = h * i / 2f
                        drawLine(grid, Offset(0f, y), Offset(w, y), strokeWidth = 1f)
                    }
                    val path = Path()
                    values.forEachIndexed { i, v ->
                        val x = w * i / (values.size - 1)
                        val y = h - (v - mn) / span * h
                        if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                    }
                    drawPath(path, color, style = Stroke(width = 3f, cap = StrokeCap.Round, join = StrokeJoin.Round))
                }
            }
        }
