            floatArrayOf(0f, 0f, 1f, 0f, 0f, 1f, 1f, 1f),
            floatArrayOf(0f, 1f, 0f, 0f, 1f, 1f, 1f, 0f),
            floatArrayOf(1f, 1f, 0f, 1f, 1f, 0f, 0f, 0f),
            floatArrayOf(1f, 0f, 1f, 1f, 0f, 0f, 0f, 1f)
