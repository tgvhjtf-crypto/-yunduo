        private class Check(
            val ok: Int,                 // 0 通过 / 1 未通过 / 2 需要手动确认
            val title: String,
            val detail: String,
            val actionLabel: String? = null,
            val action: (() -> Unit)? = null,
        )

        private fun openSystem(ctx: Context, intent: Intent) {
            try {
                ctx.startActivity(intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
            } catch (_: Throwable) {
                Toast.makeText(ctx, "无法打开该系统页面", Toast.LENGTH_SHORT).show()
            }
        }

        private fun buildChecks(ctx: Context, settings: Settings, shizuku: ShizukuState, onRecheck: () -> Unit): List<Check> {
            val list = ArrayList<Check>()

            // 1. 服务
            when (shizuku.status) {
                ServiceClient.Status.READY -> list.add(Check(0, "Shizuku 服务", "已连接，可以使用虚拟屏模式"))
                ServiceClient.Status.ROOT_READY -> list.add(Check(0, "Root 服务", "Root 可用"))
                ServiceClient.Status.NO_PERMISSION -> list.add(
                    Check(1, "Shizuku 授权", "Shizuku 已运行，但本应用还没有授权", "去授权") { ServiceClient.requestPermission() }
                )
                else -> list.add(
                    Check(1, "Shizuku / Root", "Shizuku 没有运行。请先在 Shizuku 里启动，或改用 Root 启动", "使用 Root 启动") {
                        if (settings.rootAgreed) onRecheck() else settings.showRootDisclaimer = true
                    }
                )
            }

            // 2. 游戏
            list.add(
                if (settings.pkg != null) Check(0, "已选择游戏", settings.pkg ?: "")
                else Check(1, "选择游戏", "还没有选择要玩的游戏，请回到首页选择")
            )

            // 3. 通知权限
            if (Build.VERSION.SDK_INT >= 33) {
                val granted = ctx.checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) ==
                    android.content.pm.PackageManager.PERMISSION_GRANTED
                list.add(
                    if (granted) Check(0, "通知权限", "已允许，性能监控和过热提醒可以显示")
                    else Check(1, "通知权限", "未允许，通知栏性能监控和过热提醒不会显示", "去开启") {
                        openSystem(ctx, Intent(android.provider.Settings.ACTION_APP_NOTIFICATION_SETTINGS)
                            .putExtra(android.provider.Settings.EXTRA_APP_PACKAGE, ctx.packageName))
                    }
                )
            }

            // 4. USB 调试
            val adb = try {
                android.provider.Settings.Global.getInt(ctx.contentResolver, android.provider.Settings.Global.ADB_ENABLED, 0) == 1
            } catch (_: Throwable) { false }
            list.add(
                if (adb) Check(0, "USB 调试", "已开启")
                else Check(2, "USB 调试", "没有开启。用 Shizuku 无线调试方式启动时需要开启", "开发者选项") {
                    openSystem(ctx, Intent(android.provider.Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS))
                }
            )

            // 5. 小米 / HyperOS
            val brand = (Build.MANUFACTURER + " " + Build.BRAND).lowercase()
            if (brand.contains("xiaomi") || brand.contains("redmi") || brand.contains("poco")) {
                list.add(
                    Check(2, "小米 / HyperOS：USB 调试（安全设置）", "无法自动检测。需要在开发者选项里打开，否则触控可能无法注入，游戏能进但点不动", "开发者选项") {
                        openSystem(ctx, Intent(android.provider.Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS))
                    }
                )
            }

            // 6. 电池优化
            val ignoring = try {
                ctx.getSystemService(PowerManager::class.java).isIgnoringBatteryOptimizations(ctx.packageName)
            } catch (_: Throwable) { true }
            list.add(
                if (ignoring) Check(0, "电池优化", "已设为不受限制")
                else Check(2, "电池优化", "建议设为“无限制”，避免后台被系统清理导致服务断开", "去设置") {
                    openSystem(ctx, Intent(android.provider.Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                }
            )

            // 7. 倍率提示
            if (settings.resScale > 1f) {
                list.add(Check(2, "增强分辨率已开启", "当前 ${settings.resScale}×，发热或掉帧时先把它关掉再试"))
            }
            return list
        }

        /** 自检向导：逐项检查运行条件，没通过的给出一键处理入口 */
        @Composable
        fun SetupDialog(
            settings: Settings,
            shizuku: ShizukuState,
            onRecheck: () -> Unit,
            onDismiss: () -> Unit,
        ) {
            val ctx = LocalContext.current
            var tick by remember { mutableStateOf(0) }
            val checks = remember(tick, shizuku.status) { buildChecks(ctx, settings, shizuku, onRecheck) }
            val bad = checks.count { it.ok == 1 }

            AlertDialog(
                onDismissRequest = onDismiss,
                title = { Text("自检向导") },
                text = {
                    Column(Modifier.verticalScroll(rememberScrollState())) {
                        Text(
                            if (bad == 0) "必要条件都满足了，可以开始使用。" else "有 $bad 项没通过，处理后点“重新检查”。",
                            style = MaterialTheme.typography.bodyMedium,
                            color = MaterialTheme.colorScheme.onSurfaceVariant,
                            modifier = Modifier.padding(bottom = 8.dp),
                        )
                        checks.forEach { c ->
                            Row(Modifier.fillMaxWidth().padding(vertical = 6.dp), verticalAlignment = Alignment.Top) {
                                Text(
                                    when (c.ok) { 0 -> "✅"; 1 -> "❌"; else -> "⚠️" },
                                    modifier = Modifier.padding(end = 10.dp),
                                )
                                Column(Modifier.weight(1f)) {
                                    Text(c.title, style = MaterialTheme.typography.bodyLarge, fontWeight = FontWeight.SemiBold)
                                    Text(c.detail, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                    c.action?.let { act ->
                                        TextButton(onClick = act) { Text(c.actionLabel ?: "去处理") }
                                    }
                                }
                            }
                        }
                    }
                },
                confirmButton = {
                    Row {
                        TextButton(onClick = {
                            tick++
                            onRecheck()
                        }) { Text("重新检查") }
                        TextButton(onClick = {
                            settings.setupDone = true
                            settings.save()
                            onDismiss()
                        }) { Text("完成") }
                    }
                },
            )
        }
