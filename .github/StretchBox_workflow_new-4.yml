        package com.example.stretchbox.util

        import android.content.Context
        import android.util.Log
        import java.io.File
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale

        /**
         * 持久日志：写入应用私有目录的文件，进程结束、被系统杀掉、崩溃都不会删除；
         * 只有用户在“设置 → 日志”里手动点“清空”才会清除。文件超过 1MB 时只保留最近的一半。
         */
        object AppLog {
            private const val MAX_BYTES = 1_000_000L
            private const val KEEP_BYTES = 500_000
            private const val SESSION_MAX = 80_000

            private var file: File? = null
            private val fmt = SimpleDateFormat("MM-dd HH:mm:ss.SSS", Locale.US)
            private val session = StringBuilder()

            /** 实时监听：游戏容器里的日志窗口用它滚动显示新日志 */
            @Volatile var listener: ((String) -> Unit)? = null

            @Synchronized
            fun init(ctx: Context) {
                if (file != null) return
                val dir = File(ctx.applicationContext.filesDir, "logs").apply { mkdirs() }
                file = File(dir, "stretchbox.log").also { trim(it) }
                add("I", "App", "===== 新会话 pid=${android.os.Process.myPid()} =====")
            }

            fun i(tag: String, msg: String) = add("I", tag, msg)
            fun w(tag: String, msg: String) = add("W", tag, msg)
            fun e(tag: String, msg: String, t: Throwable? = null) =
                add("E", tag, if (t == null) msg else msg + "\n" + Log.getStackTraceString(t))

            private fun add(level: String, tag: String, msg: String) {
                val line = synchronized(this) {
                    val l = fmt.format(Date()) + " " + level + "/" + tag + ": " + msg
                    session.append(l).append('\n')
                    if (session.length > SESSION_MAX) session.delete(0, session.length - SESSION_MAX)
                    try { file?.appendText(l + "\n") } catch (_: Throwable) {}
                    l
                }
                Log.println(when (level) { "E" -> Log.ERROR; "W" -> Log.WARN; else -> Log.INFO }, "StretchBox", "$tag: $msg")
                listener?.invoke(line)
            }

            /** 本次进程启动以来的日志（内存） */
            @Synchronized
            fun sessionText(): String = session.toString()

            /** 文件里最近的日志（含以前的会话） */
            @Synchronized
            fun readTail(maxChars: Int): String = try {
                val t = file?.takeIf { it.exists() }?.readText() ?: ""
                if (t.length > maxChars) t.takeLast(maxChars).substringAfter('\n') else t
            } catch (_: Throwable) { "" }

            /** 仅用户手动清空 */
            @Synchronized
            fun clear() {
                try { file?.writeText("") } catch (_: Throwable) {}
                session.setLength(0)
            }

            private fun trim(f: File) {
                try {
                    if (f.exists() && f.length() > MAX_BYTES) {
                        val t = f.readText().takeLast(KEEP_BYTES).substringAfter('\n')
                        f.writeText(t)
                    }
                } catch (_: Throwable) {}
            }
        }
        STRETCH_EOF
