        package com.example.stretchbox.shizuku
        
        import android.content.Context
        import androidx.compose.runtime.getValue
        import androidx.compose.runtime.mutableIntStateOf
        import androidx.compose.runtime.mutableStateOf
        import androidx.compose.runtime.setValue
        
        /** 给界面用的 Shizuku 状态快照（Compose 可观察） */
        class ShizukuState {
            var status by mutableStateOf(ServiceClient.Status.SHIZUKU_NOT_RUNNING)
        private set
            var version by mutableIntStateOf(-1)
        private set
            var mode by mutableStateOf<String?>(null)
        private set
            var serviceBound by mutableStateOf(false)
        private set
        
            /** 重新检测；就绪时顺便绑定服务 */
            fun refresh(ctx: Context) {
        status = ServiceClient.status()
        if (status == ServiceClient.Status.SHIZUKU_NOT_RUNNING) {
            version = -1
            mode = null
        } else {
            version = ServiceClient.serverVersion()
            mode = ServiceClient.runMode()
        }
        when (status) {
            ServiceClient.Status.READY -> ServiceClient.bind(ctx)
            ServiceClient.Status.ROOT_READY ->
                if (ServiceClient.service == null) ServiceClient.startRootService(ctx)
            else -> {}
        }
        serviceBound = ServiceClient.service != null
            }
        
            /** 只同步“服务是否已绑定”，不触发重新绑定 */
            fun syncBound() {
        serviceBound = ServiceClient.service != null
            }
        }
