            /** AIDL 有变动时要加 1，否则 Shizuku 可能继续复用旧的服务进程（旧进程里没有新接口） */
            private const val SERVICE_VERSION = 3
            private var args: Shizuku.UserServiceArgs? = null

            private val conn = object : ServiceConnection {
                override fun onServiceConnected(name: ComponentName, binder: IBinder) {
                    binding = false
                    val alive = binder.pingBinder()
                    AppLog.i("Svc", "onServiceConnected ping=$alive")
                    if (!alive) return
                    val s = IStretchService.Stub.asInterface(binder)
                    service = s
                    waiters.forEach { it(s) }
                    waiters.clear()
                    onConnectionChanged?.invoke()
                }

                override fun onServiceDisconnected(name: ComponentName) {
                    AppLog.w("Svc", "服务连接断开")
                    service = null
                    onConnectionChanged?.invoke()
                }

                override fun onBindingDied(name: ComponentName) {
                    AppLog.w("Svc", "服务绑定已失效")
                    binding = false
                    service = null
                }

                override fun onNullBinding(name: ComponentName) {
                    AppLog.w("Svc", "服务返回了空 Binder")
                    binding = false
                }
            }

