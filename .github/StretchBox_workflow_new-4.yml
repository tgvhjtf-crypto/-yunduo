             * 随后这里直接取出来 asInterface，得到和 Shizuku 模式相同的 [IStretchService]。
             */
            fun startRootService(ctx: Context) {
        if (!rootAllowed) return
        if (service != null || binding) return
        rootMode = true
        binding = true
        thread {
            val log = com.example.stretchbox.util.AppLog
            fun fail(reason: String) {
                rootMode = false
                binding = false
                android.os.Handler(android.os.Looper.getMainLooper()).post {
                    android.widget.Toast.makeText(
                        ctx.applicationContext,
                        "Root 服务启动失败：$reason。可在“画面”页开启“Root 直改比例”，它不依赖这个服务",
                        android.widget.Toast.LENGTH_LONG,
                    ).show()
                }
            }
            try {
                val apk = ctx.applicationInfo.sourceDir      // base.apk 路径
                val cmd = "CLASSPATH=$apk app_process / ${RootMain::class.java.name}"
                log.i("RootSvc", "启动 root 服务：su -c \"$cmd\"")
                val p = ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start()
                // 给 root 进程一点启动时间，随后轮询 ServiceManager
                Thread.sleep(600)
                if (!p.isAlive) {
                    val out = try { p.inputStream.bufferedReader().readText().take(800) } catch (_: Throwable) { "" }
                    log.e("RootSvc", "root 进程已退出 exit=${p.exitValue()} 输出=$out")
                    fail("root 进程启动后立即退出")
                    return@thread
