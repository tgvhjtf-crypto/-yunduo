        package com.example.stretchbox.data

        import android.content.Context
        import android.hardware.display.DisplayManager
        import android.os.Handler
        import android.os.Looper
        import android.view.Display
        import android.widget.Toast
        import com.example.stretchbox.shizuku.ServiceClient
        import com.example.stretchbox.util.AppLog
        import com.example.stretchbox.util.RootShell
        import kotlin.concurrent.thread

        /**
         * Root 直改比例：不经过虚拟屏，直接用 wm size 修改系统显示大小再启动游戏。
         * 没有额外的合成和拷贝，帧率与延迟和原生一致。
         * 短边保持原生像素数（清晰度不变）；比例比原生更宽时长边封顶为原生，避免多渲染像素拖慢帧率。
         */
        object RatioMath {
            val PRESETS = listOf(
                Triple("4:3", 4f, 3f),
                Triple("16:10", 16f, 10f),
                Triple("16:9", 16f, 9f),
                Triple("18:9", 18f, 9f),
                Triple("19.5:9", 19.5f, 9f),
                Triple("21:9", 21f, 9f),
            )

            /** “自定义”在列表里的序号 */
            val CUSTOM_IDX get() = PRESETS.size

            class Plan(val w: Int, val h: Int, val ratio: Float) {
                val size: String get() = "${w}x$h"
            }

            /** 面板原生分辨率（不受 wm size 影响）；读不到返回 null */
            fun nativeSize(ctx: Context): Pair<Int, Int>? = try {
                val d = ctx.getSystemService(DisplayManager::class.java).getDisplay(Display.DEFAULT_DISPLAY)
                d?.mode?.let { it.physicalWidth to it.physicalHeight }
            } catch (_: Throwable) { null }

            fun plan(nw: Int, nh: Int, ratio: Float): Plan {
                val r = ratio.coerceIn(1.0f, 3.0f)
                val s = minOf(nw, nh).toFloat()
                val l = maxOf(nw, nh).toFloat()
                val want = s * r
                val longN: Float
                val shortN: Float
                if (want > l) { longN = l; shortN = l / r } else { longN = want; shortN = s }
                fun even(v: Float) = (Math.round(v) / 2) * 2
                val ls = even(longN)
                val ss = even(shortN)
                // wm size 的参数按设备“自然方向”：手机是竖屏（宽 < 高）
                return if (nw <= nh) Plan(ss, ls, r) else Plan(ls, ss, r)
            }
        }

        object RatioControl {
            private val main = Handler(Looper.getMainLooper())
            private val NAME_RE = Regex("^[A-Za-z0-9_.]+$")

            private fun toast(ctx: Context, msg: String) {
                main.post { Toast.makeText(ctx.applicationContext, msg, Toast.LENGTH_LONG).show() }
            }

            /** 立即恢复系统默认比例：优先直接用 su，其次用已连接的 Shizuku 服务 */
            fun restore(ctx: Context) {
                toast(ctx, "已请求恢复系统比例")
                thread {
                    try {
                        if (ServiceClient.rootAllowed) {
                            val (c, o) = RootShell.run("wm size reset")
                            AppLog.i("Ratio", "恢复系统比例（su）exit=$c ${o.ifBlank { "OK" }}")
                        } else {
                            val svc = ServiceClient.service
                            if (svc == null) {
                                toast(ctx, "需要 Root 授权或 Shizuku 已连接；也可以在终端执行：wm size reset")
                                return@thread
                            }
                            AppLog.i("Ratio", "恢复系统比例（服务）→ " + svc.restoreRatio())
                        }
                    } catch (t: Throwable) {
                        AppLog.e("Ratio", "恢复系统比例失败", t)
                    }
                }
            }

            private fun launchComponent(ctx: Context, pkg: String): String? {
                val cn = ctx.packageManager.getLaunchIntentForPackage(pkg)?.component ?: return null
                return if (NAME_RE.matches(cn.className)) "${cn.packageName}/${cn.className}" else null
            }

            /**
             * 改比例并在主屏启动游戏；全程只用 su 命令，不需要 Root 服务。
             * 游戏退出后，root 里的看守进程会自动恢复系统比例。
             */
            fun launchDirect(ctx: Context, settings: Settings, pkg: String) {
                if (!NAME_RE.matches(pkg)) {
                    toast(ctx, "游戏包名不合法")
                    return
                }
                val nat = RatioMath.nativeSize(ctx)
                if (nat == null) {
                    toast(ctx, "读取屏幕原生分辨率失败")
                    return
                }
                val comp = launchComponent(ctx, pkg)
                if (comp == null) {
                    toast(ctx, "找不到这款游戏的启动入口")
                    return
                }
                val plan = RatioMath.plan(nat.first, nat.second, settings.ratioValue())
                val force = settings.forceStop
                AppLog.i("Ratio", "Root 直改比例：原生 ${nat.first}x${nat.second} → ${plan.size}（比例 %.3f，先结束进程=$force，入口=$comp）".format(plan.ratio))
                thread {
                    try {
                        val (c1, o1) = RootShell.run("wm size ${plan.size}")
                        AppLog.i("Ratio", "wm size ${plan.size} → exit=$c1 ${o1.ifBlank { "OK" }}")
                        if (c1 != 0) {
                            toast(ctx, "修改比例失败（退出码 $c1）：" + o1.take(100))
                            return@thread
                        }
                        // 看守：等游戏进程出现（最多 60 秒）再等它退出，然后自动恢复系统比例
                        val script = "i=0; while ! pidof $pkg >/dev/null 2>&1 && [ \$i -lt 60 ]; do sleep 1; i=\$((i+1)); done; " +
                            "while pidof $pkg >/dev/null 2>&1; do sleep 2; done; wm size reset"
                        val (cw, _) = RootShell.run("nohup sh -c '$script' >/dev/null 2>&1 &", 4000)
                        AppLog.i("Ratio", "已启动恢复看守 exit=$cw")

                        val stop = if (force) "am force-stop $pkg; " else ""
                        val clear = if (force) " --activity-clear-task" else ""
                        val (c2, o2) = RootShell.run("${stop}am start --display 0 --activity-exclude-from-recents$clear -n $comp")
                        AppLog.i("Launch", "am start（主屏）exit=$c2 输出：" + o2.ifBlank { "（无输出）" })
                        if (c2 != 0 || o2.contains("Error", true) || o2.contains("Exception", true)) {
                            toast(ctx, "启动失败：" + o2.take(120))
                            RootShell.run("wm size reset")
                        }
                    } catch (t: Throwable) {
                        AppLog.e("Ratio", "直改比例启动失败", t)
                        toast(ctx, "启动失败：${t.message}")
                    }
                }
            }
        }
        STRETCH_EOF
