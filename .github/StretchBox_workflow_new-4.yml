        import android.content.Context
        import android.content.ContextWrapper
        import android.os.Looper
        
        /**
         * 在 Shizuku 的 shell 进程（不是普通 App 进程）里没有 Application Context。
         * 这里仿照 scrcpy：手动造一个 ActivityThread，拿到 SystemContext，
         * 再包一层，把包名伪装成 com.android.shell。
         */
        class FakeContext private constructor(base: Context) : ContextWrapper(base) {
            override fun getPackageName(): String = "com.android.shell"
            override fun getOpPackageName(): String = "com.android.shell"
            override fun getApplicationContext(): Context = this
        
            companion object {
        fun create(): Context {
            if (Looper.myLooper() == null) {
                try { Looper.prepareMainLooper() } catch (e: Throwable) { Looper.prepare() }
            }
            val atClass = Class.forName("android.app.ActivityThread")
            var at = atClass.getDeclaredMethod("currentActivityThread").invoke(null)
            if (at == null) {
                val ctor = atClass.getDeclaredConstructor().apply { isAccessible = true }
                at = ctor.newInstance()
                atClass.getDeclaredField("sCurrentActivityThread")
                    .apply { isAccessible = true }.set(null, at)
                atClass.getDeclaredField("mSystemThread")
                    .apply { isAccessible = true }.setBoolean(at, true)
            }
            val sys = atClass.getDeclaredMethod("getSystemContext").invoke(at) as Context
            return FakeContext(sys)
        }
