        /** 主题色色板：一排圆形色块，点一下选色；当前选中的带描边和对勾 */
        @OptIn(ExperimentalLayoutApi::class)
        @Composable
        fun HueSwatches(hues: List<Float>, selected: Float?, onPick: (Float) -> Unit, modifier: Modifier = Modifier) {
            FlowRow(
                modifier = modifier.padding(horizontal = 20.dp, vertical = 8.dp),
                horizontalArrangement = Arrangement.spacedBy(12.dp),
                verticalArrangement = Arrangement.spacedBy(12.dp),
            ) {
                hues.forEach { h ->
                    val c = Color(android.graphics.Color.HSVToColor(floatArrayOf(h, 0.6f, 0.75f)))
                    val sel = selected != null && abs(selected - h) < 1f
                    Box(
                        modifier = Modifier
                            .size(40.dp)
                            .clip(CircleShape)
                            .background(c)
                            .then(if (sel) Modifier.border(3.dp, MaterialTheme.colorScheme.onSurface, CircleShape) else Modifier)
                            .clickable { onPick(h) },
                        contentAlignment = Alignment.Center,
                    ) {
                        if (sel) Text("✓", color = Color.White)
                    }
                }
            }
        }
