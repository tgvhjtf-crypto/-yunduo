        package com.example.stretchbox.data

        /**
         * 增强分辨率：虚拟屏按倍率放大（超采样），DPI 同步放大，所以游戏界面大小不变，
         * 只是游戏拿到更多像素，缩回真屏时更清晰、锯齿更少。单边上限 4096。
         */
        object ResBoost {
            const val MAX_SIDE = 4096
            const val MAX_PIXELS = 8_300_000   // 约 4K，超过后大多数手机 GPU 撑不住，帧率会掉到个位数

            class Result(val w: Int, val h: Int, val dpi: Int, val k: Float)

            fun apply(w: Int, h: Int, dpi: Int, k: Float): Result {
                val cap = minOf(
                MAX_SIDE.toFloat() / maxOf(w, h, 1),
                Math.sqrt(MAX_PIXELS.toDouble() / (w.toDouble() * h).coerceAtLeast(1.0)).toFloat(),
            )
                val kk = k.coerceAtLeast(1f).coerceAtMost(cap).coerceAtLeast(1f)
                fun even(v: Float) = (Math.round(v) / 2) * 2
                return Result(even(w * kk), even(h * kk), Math.round(dpi * kk), kk)
            }

            /** 可选倍率 */
            val SCALES = listOf(1f to "关", 1.25f to "1.25×", 1.5f to "1.5×", 2f to "2×")
        }
