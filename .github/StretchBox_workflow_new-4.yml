            }
        
            override fun readFile(path: String): String = try {
        java.io.FileInputStream(path).bufferedReader().use { it.readText() }.take(8192)
            } catch (t: Throwable) { "" }
        
            override fun applyRatio(size: String, pkg: String): String {
        if (!Regex("^\\d{3,5}x\\d{3,5}$").matches(size)) return "ERR: 非法尺寸 $size"
        if (!Regex("^[A-Za-z0-9_.]+$").matches(pkg)) return "ERR: 非法包名 $pkg"
        val out = sh("wm", "size", size)
        // 看守：先等游戏进程出现（最多 60 秒），再等它退出，然后自动恢复系统显示大小，避免比例被留在改过的状态
        val script = "i=0; while ! pidof $pkg >/dev/null 2>&1 && [ \$i -lt 60 ]; do sleep 1; i=\$((i+1)); done; " +
            "while pidof $pkg >/dev/null 2>&1; do sleep 2; done; wm size reset"
        try { ProcessBuilder("sh", "-c", "nohup sh -c '$script' >/dev/null 2>&1 &").start() } catch (_: Throwable) {}
        return out.ifBlank { "OK" }
            }
        
            override fun restoreRatio(): String = sh("wm", "size", "reset").ifBlank { "OK" }
        
            override fun configure(rotatesWithContent: Boolean) {
        this.rotatesWithContent = rotatesWithContent
            }
        
            override fun setDisplayRotation(displayId: Int, rotation: Int): String =
        sh("cmd", "window", "user-rotation", "-d", displayId.toString(), "lock", rotation.toString())
        
            @Synchronized
            override fun resizeDisplay(width: Int, height: Int, dpi: Int) {
        vd?.resize(width, height, dpi)
            }
        
            @Synchronized
            override fun setSurface(surface: Surface?) {
        vd?.surface = surface
            }
        
            @Synchronized
            override fun releaseDisplay() {
        vd?.release()
        vd = null
        prevForceResizable?.let {
            if (it == "null" || it.isEmpty()) sh("settings", "delete", "global", "force_resizable_activities")
            else sh("settings", "put", "global", "force_resizable_activities", it)
        }
        prevForceResizable = null
            }
        
            // ---------------- 启动游戏 ----------------
        
            override fun launch(pkg: String, displayId: Int, forceStop: Boolean): String {
        if (forceStop) sh("am", "force-stop", pkg)
        val resolved = sh(
            "cmd", "package", "resolve-activity", "--brief",
            "-a", "android.intent.action.MAIN", "-c", "android.intent.category.LAUNCHER", pkg
        )
        val component = resolved.lines().map { it.trim() }.lastOrNull { it.contains('/') && !it.contains(' ') }
            ?: return "找不到启动 Activity: $resolved"
                        val args = mutableListOf("am", "start", "--display", displayId.toString(), "--activity-exclude-from-recents")
        if (forceStop) args.add("--activity-clear-task")
        args.addAll(listOf("-n", component))
        return sh(*args.toTypedArray())
            }
        
            // ---------------- 输入 ----------------
        
            override fun injectTouch(displayId: Int, event: MotionEvent) {
        val inj = injector
        if (inj == null) { event.recycle(); return }
        try { inj.touch(displayId, event) } catch (t: Throwable) { Log.e(TAG, "injectTouch", t) }
            }
        
            override fun injectKey(displayId: Int, keyCode: Int) {
        try { injector?.key(displayId, keyCode) } catch (t: Throwable) { Log.e(TAG, "injectKey", t) }
            }
        
            override fun destroy() {
        releaseDisplay()
        exitProcess(0)
            }
        }
