            rootAllowed = false
            rootAvailable = false
        }
        
            private const val REQ_CODE = 1001
        
            @Volatile var service: IStretchService? = null
        private set
            @Volatile private var binding = false
            private val waiters = CopyOnWriteArrayList<(IStretchService) -> Unit>()
        
            /** 服务连上 / 断开时通知界面（可能不在主线程） */
