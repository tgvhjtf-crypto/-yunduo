            override fun onFrameAvailable(st: SurfaceTexture) {
        val now = android.os.SystemClock.elapsedRealtime()
        lastFrameAt = now
        if (!firstFrameLogged) {
            firstFrameLogged = true
            com.example.stretchbox.util.AppLog.i("Render", "收到游戏第一帧")
        }
        if (fpsT0 == 0L) fpsT0 = now
        fpsCount++
        if (now - fpsT0 >= 1000) {
            fpsValue = Math.round(fpsCount * 1000f / (now - fpsT0))
            fpsCount = 0
            fpsT0 = now
        }
