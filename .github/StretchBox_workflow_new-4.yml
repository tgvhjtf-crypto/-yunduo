         *   su -c "CLASSPATH=/data/app/.../base.apk app_process / com.example.stretchbox.service.RootMain"
         */
        object RootMain {
            const val SERVICE_NAME = "stretchbox"
            private const val TAG = "StretchRoot"
        
            @JvmStatic
            fun main(args: Array<String>) {
                try {
                    Looper.prepareMainLooper()
                    // 必须在有 Looper 的线程外构造 Binder（StretchService 构造会反射造 Looper）
                    val service = StretchService()
                    val binder: IBinder = service // StretchService 继承 IStretchService.Stub，即 Binder
                    val sm = Class.forName("android.os.ServiceManager")
                        .getMethod("addService", String::class.java, IBinder::class.java)
                    sm.invoke(null, SERVICE_NAME, binder)
                    Log.i(TAG, "root service registered as '$SERVICE_NAME'")
                    // 常驻：阻塞主线程等待进程被回收
                    Looper.loop()
                } catch (t: Throwable) {
                    Log.e(TAG, "root 启动失败", t)
                    exitProcess(1)
                }
            }
        }
