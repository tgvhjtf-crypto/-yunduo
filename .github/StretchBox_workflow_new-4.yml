        package com.example.stretchbox.data

        import android.content.Context
        import android.graphics.Bitmap
        import android.graphics.BitmapFactory
        import android.net.Uri
        import com.example.stretchbox.util.AppLog
        import org.json.JSONArray
        import org.json.JSONObject
        import java.io.File

        /** 一条备忘：标题、比例/分辨率、笔记、图片（文件名，保存在应用私有目录） */
        class Memo(
            val id: Long,
            var title: String,
            var ratio: String,
            var note: String,
            var images: List<String>,
            var updated: Long,
            var sens: String = "",
        )

        /**
         * 备忘存储：JSON + 图片文件都放在应用私有目录 files/memos 下。
         * 退出应用、结束进程都不会删除，只有用户手动删除备忘（或清除应用数据）才会清掉。
         */
        object MemoStore {
            private fun dir(ctx: Context): File = File(ctx.filesDir, "memos").apply { mkdirs() }

            fun imageFile(ctx: Context, name: String): File = File(dir(ctx), name)

            fun load(ctx: Context): List<Memo> {
                return try {
                    val f = File(dir(ctx), "memos.json")
                    if (!f.exists()) return emptyList()
                    val arr = JSONArray(f.readText())
                    (0 until arr.length()).map { i ->
                        val o = arr.getJSONObject(i)
                        val imgs = o.optJSONArray("images")
                        Memo(
                            id = o.optLong("id"),
                            title = o.optString("title"),
                            ratio = o.optString("ratio"),
                            note = o.optString("note"),
                            images = if (imgs == null) emptyList() else (0 until imgs.length()).map { imgs.getString(it) },
                            updated = o.optLong("updated"),
                    sens = o.optString("sens"),
                        )
                    }
                } catch (t: Throwable) {
                    AppLog.e("Memo", "读取备忘失败", t)
                    emptyList()
                }
            }

            fun save(ctx: Context, list: List<Memo>) {
                try {
                    val arr = JSONArray()
                    list.forEach { m ->
                        arr.put(JSONObject().apply {
                            put("id", m.id)
                            put("title", m.title)
                            put("ratio", m.ratio)
                            put("note", m.note)
                            put("images", JSONArray(m.images))
                            put("updated", m.updated)
                    put("sens", m.sens)
                        })
                    }
                    val f = File(dir(ctx), "memos.json")
                    val tmp = File(dir(ctx), "memos.json.tmp")
                    tmp.writeText(arr.toString())
                    if (!tmp.renameTo(f)) {
                        f.writeText(arr.toString())
                        tmp.delete()
                    }
                } catch (t: Throwable) {
                    AppLog.e("Memo", "保存备忘失败", t)
                }
            }

            /** 把用户选的图片复制进应用私有目录，返回保存后的文件名（不依赖相册里的原文件） */
            fun importImage(ctx: Context, uri: Uri): String? {
                return try {
                    val name = "img_${System.currentTimeMillis()}_${(0..9999).random()}.bin"
                    val input = ctx.contentResolver.openInputStream(uri) ?: return null
                    input.use { ins -> File(dir(ctx), name).outputStream().use { ins.copyTo(it) } }
                    name
                } catch (t: Throwable) {
                    AppLog.e("Memo", "导入图片失败", t)
                    null
                }
            }

            fun deleteImage(ctx: Context, name: String) {
                try { imageFile(ctx, name).delete() } catch (_: Throwable) {}
            }

            /** 按长边不超过 maxPx 解码缩略图 */
            fun decode(file: File, maxPx: Int): Bitmap? {
                return try {
                    val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                    BitmapFactory.decodeFile(file.path, bounds)
                    var sample = 1
                    val big = maxOf(bounds.outWidth, bounds.outHeight)
                    while (big / sample > maxPx * 2) sample *= 2
                    BitmapFactory.decodeFile(file.path, BitmapFactory.Options().apply { inSampleSize = sample })
                } catch (_: Throwable) {
                    null
                }
            }
        }
