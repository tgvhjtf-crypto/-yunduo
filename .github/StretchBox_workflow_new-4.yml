            private var surfaceTexture: SurfaceTexture? = null
            private var surface: Surface? = null
            private var view: GLSurfaceView? = null
            private var program = 0
            private var texId = 0
        
            private var uTexMatrix = 0
            private var uBrightness = 0
            private var uContrast = 0
            private var uSaturation = 0
            private var uWarmth = 0
            private var uSharp = 0
            private var uTexel = 0
            private var aPos = 0
            private var aUV = 0
        
            @Volatile private var brightness = 0f
            @Volatile private var contrast = 0f
            @Volatile private var saturation = 0f
            @Volatile private var warmth = 0f
            @Volatile private var sharp = 0f
            @Volatile private var rotation = 0
            @Volatile private var flipV = false
            @Volatile private var flipH = false
        
            private val texMatrix = FloatArray(16)
            private val quadData = FloatArray(8)
            private val quad: FloatBuffer = newFloatBuffer(0f, 0f, 0f, 0f, 0f, 0f, 0f, 0f)
            private val texCoords: FloatBuffer = newFloatBuffer(0f, 0f, 0f, 0f, 0f, 0f, 0f, 0f)
        
            private fun newFloatBuffer(vararg v: Float): FloatBuffer =
        ByteBuffer.allocateDirect(v.size * 4).order(ByteOrder.nativeOrder())
            .asFloatBuffer().apply { put(v); position(0) }
        
            fun setView(v: GLSurfaceView) { view = v }
        
            fun setColors(b: Float, c: Float, s: Float, w: Float) {
        brightness = b; contrast = c; saturation = s; warmth = w
            }
        
            /** 锐化强度 0..1 */
            fun setSharpness(v: Float) { sharp = v }
        
            /** 缓冲区内容相对于显示方向的旋转：Display.getRotation() 的值 0..3 */
            fun setRotation(r: Int) { rotation = r and 3 }
        
