        import androidx.compose.ui.unit.Dp
        import androidx.compose.ui.unit.dp

        /**
         * 响应式瀑布流：按实际可用宽度自动分栏——手机竖屏 1 列，平板 / 横屏 2 列，大屏 3 列。
         * 子项按“最短的一列优先”排布，所以各页面原有的卡片不用改就能自适应。
         */
        @Composable
        fun AdaptiveColumn(
            modifier: Modifier = Modifier,
            spacing: Dp = 12.dp,
            content: @Composable () -> Unit,
        ) {
            Layout(content = content, modifier = modifier) { measurables, constraints ->
                val gap = spacing.roundToPx()
                val totalW = constraints.maxWidth
                val wDp = totalW / density
                val cols = when {
                    wDp >= 960f -> 3
                    wDp >= 560f -> 2
                    else -> 1
                }
                val colW = (totalW - gap * (cols - 1)) / cols
                val heights = IntArray(cols)
                val placeables = measurables.map { it.measure(Constraints(minWidth = colW, maxWidth = colW)) }
                val slots = ArrayList<IntArray>()
                placeables.forEach { p ->
                    var c = 0
                    for (i in 1 until cols) if (heights[i] < heights[c]) c = i
                    slots.add(intArrayOf(c, heights[c]))
                    heights[c] += p.height + gap
                }
                val h = ((heights.maxOrNull() ?: 0) - gap).coerceAtLeast(0)
                layout(totalW, maxOf(h, constraints.minHeight)) {
                    placeables.forEachIndexed { i, p ->
                        p.placeRelative(slots[i][0] * (colW + gap), slots[i][1])
                    }
                }
            }
        }

