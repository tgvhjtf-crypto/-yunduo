        fun MemoScreen(settings: Settings, modifier: Modifier = Modifier) {
            val ctx = LocalContext.current
            val memos = remember { mutableStateListOf<Memo>().apply { addAll(MemoStore.load(ctx)) } }
            var showEditor by remember { mutableStateOf(false) }
            var editing by remember { mutableStateOf<Memo?>(null) }
            var deleting by remember { mutableStateOf<Memo?>(null) }
            var viewer by remember { mutableStateOf<Pair<List<String>, Int>?>(null) }

            Box(modifier) {
                AdaptiveColumn(
                    modifier = Modifier
                        .fillMaxSize()
                        .verticalScroll(rememberScrollState())
                        .padding(horizontal = 16.dp, vertical = 8.dp),
                ) {
                    AppCard {
                        SectionTitle("备忘")
                        HintText("存放每款游戏的比例、灵敏度截图和笔记，不用再去相册里来回翻。内容只保存在本机，结束进程也不会丢")
                        FilledTonalButton(
                            onClick = {
                                editing = null
                                showEditor = true
                            },
                            modifier = Modifier.padding(horizontal = 20.dp, vertical = 8.dp),
                        ) { Text("＋ 新建备忘") }
                        Spacer(Modifier.height(8.dp))
                    }
                    memos.forEach { m ->
                        key(m.id) {
                            AppCard {
                                Text(
                                    m.title.ifBlank { "（未命名）" },
                                    style = MaterialTheme.typography.titleMedium,
                                    fontWeight = FontWeight.SemiBold,
                                    modifier = Modifier.padding(start = 20.dp, end = 20.dp, top = 16.dp),
                                )
                                if (m.ratio.isNotBlank()) {
                                    Text(
                                        m.ratio,
                                        style = MaterialTheme.typography.bodyMedium,
                                        color = MaterialTheme.colorScheme.primary,
                                        modifier = Modifier.padding(horizontal = 20.dp, vertical = 4.dp),
                                    )
                                }
                                if (m.sens.isNotBlank()) {
                            Text(
                                "灵敏度：" + m.sens,
                                style = MaterialTheme.typography.bodyMedium,
                                modifier = Modifier.padding(horizontal = 20.dp, vertical = 4.dp),
                            )
                        }
                        if (m.note.isNotBlank()) {
                                    Text(
                                        m.note,
                                        style = MaterialTheme.typography.bodyMedium,
                                        modifier = Modifier.padding(horizontal = 20.dp, vertical = 4.dp),
                                    )
                                }
                                if (m.images.isNotEmpty()) {
                                    FlowRow(
                                        modifier = Modifier.padding(horizontal = 20.dp, vertical = 8.dp),
                                        horizontalArrangement = Arrangement.spacedBy(8.dp),
                                        verticalArrangement = Arrangement.spacedBy(8.dp),
                                    ) {
                                        m.images.forEachIndexed { i, name ->
                                            MemoImage(
                                                MemoStore.imageFile(ctx, name), 320,
                                                Modifier.size(96.dp).clip(RoundedCornerShape(12.dp)).clickable { viewer = m.images to i },
                                                ContentScale.Crop,
                                            )
                                        }
                                    }
                                }
                                Row(Modifier.fillMaxWidth().padding(horizontal = 8.dp), horizontalArrangement = Arrangement.End) {
                                    TextButton(onClick = {
                                        editing = m
                                        showEditor = true
                                    }) { Text("编辑") }
                                    TextButton(onClick = { deleting = m }) { Text("删除") }
                                }
                            }
                        }
                    }
                    Spacer(Modifier.height(24.dp))
                }

                if (showEditor) {
                    MemoEditor(
                        initial = editing,
                        settings = settings,
                        onSave = { m ->
                            val i = memos.indexOfFirst { it.id == m.id }
                            if (i >= 0) memos[i] = m else memos.add(0, m)
                            MemoStore.save(ctx, memos.toList())
                            showEditor = false
                        },
                        onCancel = { showEditor = false },
                    )
                }
                deleting?.let { m ->
                    AlertDialog(
                        onDismissRequest = { deleting = null },
                        title = { Text("删除这条备忘？") },
                        text = { Text("里面的图片也会一起删除，无法恢复。") },
                        confirmButton = {
                            TextButton(onClick = {
                                m.images.forEach { MemoStore.deleteImage(ctx, it) }
                                memos.remove(m)
                                MemoStore.save(ctx, memos.toList())
                                deleting = null
                            }) { Text("删除") }
                        },
                        dismissButton = { TextButton(onClick = { deleting = null }) { Text("取消") } },
                    )
                }
                viewer?.let { v -> ImageViewer(v.first, v.second) { viewer = null } }
            }
        }

        @OptIn(ExperimentalLayoutApi::class)
        @Composable
        private fun MemoEditor(initial: Memo?, settings: Settings, onSave: (Memo) -> Unit, onCancel: () -> Unit) {
            val ctx = LocalContext.current
            var title by remember { mutableStateOf(initial?.title ?: "") }
            var ratio by remember { mutableStateOf(initial?.ratio ?: "") }
            var note by remember { mutableStateOf(initial?.note ?: "") }
            var sens by remember { mutableStateOf(initial?.sens ?: "") }
            val images = remember { mutableStateListOf<String>().apply { addAll(initial?.images ?: emptyList()) } }
            val added = remember { mutableListOf<String>() }      // 这次新加的：取消时要删掉
            val removed = remember { mutableListOf<String>() }    // 这次移除的旧图：保存时才删文件

            val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetMultipleContents()) { uris ->
                uris.forEach { u ->
                    MemoStore.importImage(ctx, u)?.let {
                        images.add(it)
                        added.add(it)
                    }
                }
            }
            fun cancel() {
                added.forEach { MemoStore.deleteImage(ctx, it) }
                onCancel()
            }

            AlertDialog(
                onDismissRequest = { cancel() },
                title = { Text(if (initial == null) "新建备忘" else "编辑备忘") },
                text = {
                    Column(Modifier.verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                        OutlinedTextField(
                            value = title,
                            onValueChange = { title = it },
                            label = { Text("标题（如：三角洲 4:3 灵敏度）") },
                            singleLine = true,
                            modifier = Modifier.fillMaxWidth(),
                        )
                        OutlinedTextField(
                            value = ratio,
                            onValueChange = { ratio = it },
                            label = { Text("比例 / 分辨率") },
                            modifier = Modifier.fillMaxWidth(),
                        )
                        TextButton(onClick = { ratio = currentRatioText(ctx, settings) }) { Text("填入当前的比例设置") }
                OutlinedTextField(
                    value = sens,
                    onValueChange = { sens = it },
                    label = { Text("灵敏度（开镜 / 陀螺仪 / 镜头等）") },
                    minLines = 2,
                    modifier = Modifier.fillMaxWidth(),
                )
                        OutlinedTextField(
                            value = note,
                            onValueChange = { note = it },
                            label = { Text("笔记") },
                            minLines = 3,
                            modifier = Modifier.fillMaxWidth(),
                        )
                        Text("图片", style = MaterialTheme.typography.labelLarge)
                        FlowRow(
                            horizontalArrangement = Arrangement.spacedBy(8.dp),
                            verticalArrangement = Arrangement.spacedBy(8.dp),
                        ) {
                            images.toList().forEach { name ->
                                Box(Modifier.size(84.dp)) {
                                    MemoImage(
                                        MemoStore.imageFile(ctx, name), 240,
                                        Modifier.fillMaxSize().clip(RoundedCornerShape(10.dp)),
                                        ContentScale.Crop,
                                    )
                                    Box(
                                        modifier = Modifier
                                            .align(Alignment.TopEnd)
                                            .size(24.dp)
                                            .clip(CircleShape)
                                            .background(Color(0xAA000000))
                                            .clickable {
                                                images.remove(name)
                                                if (added.remove(name)) MemoStore.deleteImage(ctx, name) else removed.add(name)
                                            },
                                        contentAlignment = Alignment.Center,
                                    ) { Text("✕", color = Color.White, fontSize = 12.sp) }
                                }
                            }
                        }
                        TextButton(onClick = { picker.launch("image/*") }) { Text("＋ 添加图片") }
                    }
                },
                confirmButton = {
                    TextButton(onClick = {
                        removed.forEach { MemoStore.deleteImage(ctx, it) }
                        onSave(
                            Memo(
                                id = initial?.id ?: System.currentTimeMillis(),
                                title = title.trim(),
                                ratio = ratio.trim(),
                                note = note.trim(),
                                images = images.toList(),
                                updated = System.currentTimeMillis(),
                        sens = sens.trim(),
                            )
                        )
                    }) { Text("保存") }
                },
                dismissButton = { TextButton(onClick = { cancel() }) { Text("取消") } },
            )
        }

        /** 全屏看图：双指缩放、拖动，多张时可切换 */
        @Composable
        private fun ImageViewer(names: List<String>, start: Int, onClose: () -> Unit) {
            val ctx = LocalContext.current
            var idx by remember { mutableStateOf(start.coerceIn(0, names.size - 1)) }
            var scale by remember(idx) { mutableStateOf(1f) }
            var offset by remember(idx) { mutableStateOf(Offset.Zero) }
            Dialog(onDismissRequest = onClose, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                Box(Modifier.fillMaxSize().background(Color.Black)) {
                    MemoImage(
                        MemoStore.imageFile(ctx, names[idx]), 1600,
                        Modifier
                            .fillMaxSize()
                            .graphicsLayer {
                                scaleX = scale
                                scaleY = scale
                                translationX = offset.x
                                translationY = offset.y
                            }
                            .pointerInput(idx) {
                                detectTransformGestures { _, pan, zoom, _ ->
                                    scale = (scale * zoom).coerceIn(1f, 5f)
                                    offset = if (scale <= 1f) Offset.Zero else offset + pan
                                }
                            },
                        ContentScale.Fit,
                    )
                    TextButton(onClick = onClose, modifier = Modifier.align(Alignment.TopEnd).padding(12.dp)) {
                        Text("关闭", color = Color.White)
                    }
                    if (names.size > 1) {
                        Row(
                            modifier = Modifier.align(Alignment.BottomCenter).padding(16.dp),
                            verticalAlignment = Alignment.CenterVertically,
                        ) {
                            TextButton(onClick = { idx = (idx - 1 + names.size) % names.size }) { Text("◀", color = Color.White) }
                            Text("${idx + 1} / ${names.size}", color = Color.White)
                            TextButton(onClick = { idx = (idx + 1) % names.size }) { Text("▶", color = Color.White) }
                        }
                    }
                }
            }
        }
