        package com.example.stretchbox.util

        import android.app.Notification
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.app.PendingIntent
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.os.BatteryManager
        import com.example.stretchbox.shizuku.ServiceClient
        import kotlin.concurrent.thread
        import kotlin.math.abs

        /**
         * 性能监控：每秒采集 帧率 / 功率 / CPU / GPU / 电池温度，显示在常驻通知里。
         *  - 功率：电池电流 × 电压（读不到电流的机型显示 --）
         *  - CPU：通过 Shizuku(shell) 读 /proc/stat 计算
         *  - GPU：通过 Shizuku(shell) 尝试读取常见 GPU 节点（高通 kgsl / Mali 等），机型不支持则显示 --
         */
        class StatsMonitor(context: Context, private val fps: () -> Int) {

            private val ctx = context.applicationContext
            private val nm = ctx.getSystemService(NotificationManager::class.java)
            @Volatile private var running = false

            private var lastTotal = 0L
            private var lastIdle = 0L
            private var gpuPath: String? = null
            private var gpuProbed = false

            fun start() {
                if (running) return
                running = true
                nm.createNotificationChannel(
                    NotificationChannel(CHANNEL, "性能监控", NotificationManager.IMPORTANCE_LOW).apply { setShowBadge(false) }
                )
                thread(name = "StatsMonitor", isDaemon = true) {
                    while (running) {
                        try {
                            post()
                            Thread.sleep(1000)
                        } catch (_: InterruptedException) {
                            break
                        } catch (_: Throwable) {
                        }
                    }
                }
            }

            fun stop() {
                running = false
                nm.cancel(ID)
            }

            private fun post() {
                val bat = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                val vRaw = (bat?.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0) ?: 0).toDouble()
                val volt = if (vRaw > 100) vRaw / 1000.0 else vRaw          // mV -> V
                val temp = (bat?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10.0

                var cur = ctx.getSystemService(BatteryManager::class.java)
                    .getLongProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW).toDouble()
                if (abs(cur) >= 20000) cur /= 1000.0                         // µA -> mA（各厂商单位不一）
                val watt = if (cur == 0.0 || volt == 0.0) null else abs(cur) / 1000.0 * volt

                val cpu = cpuUsage()
                val gpu = gpuUsage()

                val wText = watt?.let { "%.1f W".format(it) } ?: "--"
                val cText = cpu?.let { "$it%" } ?: "--"
                val gText = gpu?.let { "$it%" } ?: "--"
                val line1 = "帧率 ${fps()} FPS　功率 $wText"
                val line2 = "CPU $cText　GPU $gText　电池 ${"%.1f".format(temp)}℃"

                val open = ctx.packageManager.getLaunchIntentForPackage(ctx.packageName)?.let {
                    PendingIntent.getActivity(ctx, 0, it, PendingIntent.FLAG_IMMUTABLE)
                }
                val n = Notification.Builder(ctx, CHANNEL)
                    .setSmallIcon(android.R.drawable.ic_menu_info_details)
                    .setContentTitle(line1)
                    .setContentText(line2)
                    .setStyle(Notification.BigTextStyle().bigText("$line1\n$line2"))
                    .setOngoing(true)
                    .setOnlyAlertOnce(true)
                    .setShowWhen(false)
                    .setContentIntent(open)
                    .build()
                if (running) nm.notify(ID, n)
            }

            private fun cpuUsage(): Int? {
                val txt = ServiceClient.service?.readFile("/proc/stat") ?: return null
                val line = txt.lineSequence().firstOrNull { it.startsWith("cpu ") } ?: return null
                val p = line.trim().split(Regex("\\s+")).drop(1).mapNotNull { it.toLongOrNull() }
                if (p.size < 5) return null
                val idle = p[3] + p[4]
                val total = p.sum()
                val dT = total - lastTotal
                val dI = idle - lastIdle
                val first = lastTotal == 0L
                lastTotal = total
                lastIdle = idle
                if (first || dT <= 0) return null
                return ((dT - dI) * 100 / dT).toInt().coerceIn(0, 100)
            }

            private fun gpuUsage(): Int? {
                val svc = ServiceClient.service ?: return null
                if (gpuProbed && gpuPath == null) return null
                for (path in gpuPath?.let { listOf(it) } ?: GPU_PATHS) {
                    val v = parseGpu(path, svc.readFile(path))
                    if (v != null) {
                        gpuPath = path
                        gpuProbed = true
                        return v
                    }
                }
                gpuProbed = true
                return null
            }

            private fun parseGpu(path: String, txt: String): Int? {
                val nums = Regex("\\d+").findAll(txt).map { it.value.toLong() }.toList()
                if (nums.isEmpty()) return null
                val v = if (path.endsWith("gpubusy") && nums.size >= 2) {
                    if (nums[1] <= 0) return null
                    nums[0] * 100 / nums[1]
                } else nums[0]
                return if (v in 0..100) v.toInt() else null
            }

            companion object {
                private const val CHANNEL = "stats"
                private const val ID = 7001
                private val GPU_PATHS = listOf(
                    "/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage",
                    "/sys/class/kgsl/kgsl-3d0/gpubusy",
                    "/sys/class/misc/mali0/device/utilisation",
                    "/sys/kernel/gpu/gpu_busy",
                    "/sys/kernel/ged/hal/gpu_utilization",
                )
            }
        }
        STRETCH_EOF
