        package com.example.stretchbox.util

        import android.content.Context
        import android.content.Intent
        import android.hardware.display.DisplayManager
        import android.os.Build
        import android.view.Display
        import android.widget.Toast
        import com.example.stretchbox.data.Settings
        import com.example.stretchbox.shizuku.ServiceClient

        /** 一键诊断包：设备信息 + 当前设置 + 帧率记录 + 最近日志，通过系统分享发出去 */
        object DiagReport {

            fun build(ctx: Context, s: Settings): String {
                val sb = StringBuilder()
                val ver = try { ctx.packageManager.getPackageInfo(ctx.packageName, 0).versionName } catch (_: Throwable) { "?" }
                sb.appendLine("== 云朵工具箱 诊断包 ==")
                sb.appendLine("版本: $ver")
                sb.appendLine("设备: ${Build.MANUFACTURER} ${Build.MODEL} (${Build.DEVICE})")
                sb.appendLine("Android: ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT}) ${Build.DISPLAY}")
                try {
                    val d = ctx.getSystemService(DisplayManager::class.java).getDisplay(Display.DEFAULT_DISPLAY)
                    sb.appendLine("屏幕: ${d?.mode?.physicalWidth}x${d?.mode?.physicalHeight} ${d?.refreshRate}Hz 最高 ${d?.supportedModes?.maxOfOrNull { it.refreshRate }}Hz dpi=${ctx.resources.displayMetrics.densityDpi}")
                } catch (_: Throwable) {}
                sb.appendLine("服务: 已连接=${ServiceClient.service != null} Root模式=${ServiceClient.rootMode} 已同意Root声明=${s.rootAgreed}")
                sb.appendLine()
                sb.appendLine("-- 当前设置 --")
                sb.appendLine("游戏=${s.pkg} 按游戏保存=${s.perGame}")
                sb.appendLine("虚拟屏=${s.widthText}x${s.heightText} dpi=${s.dpiText} 请求帧率=${s.refreshHz}")
                sb.appendLine("增强分辨率=${s.resScale}× 提升帧率=${s.boostFps} 锐化=${s.sharpness}")
                sb.appendLine("Root直改比例=${s.ratioMode} 预设序号=${s.ratioIdx} 比例=${s.ratioValue()}")
                sb.appendLine("陀螺仪修复=${s.gyroFix} 反转=${s.gyroInvert} 启动前结束进程=${s.forceStop}")
                FpsRecorder.last(ctx)?.let {
                    sb.appendLine()
                    sb.appendLine("-- 帧率记录（上一次）--")
                    sb.appendLine(it)
                }
                sb.appendLine()
                sb.appendLine("-- 最近日志 --")
                sb.append(AppLog.readTail(60000))
                return sb.toString()
            }

            fun share(ctx: Context, s: Settings) {
                val text = build(ctx, s)
                val send = Intent(Intent.ACTION_SEND).apply {
                    type = "text/plain"
                    putExtra(Intent.EXTRA_SUBJECT, "云朵工具箱 诊断包")
                    putExtra(Intent.EXTRA_TEXT, text)
                }
                try {
                    ctx.startActivity(Intent.createChooser(send, "分享诊断包").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                } catch (_: Throwable) {
                    Toast.makeText(ctx.applicationContext, "无法打开分享面板", Toast.LENGTH_SHORT).show()
                }
            }
        }
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/java/com/example/stretchbox/util/RootShell.kt')"
        cat > 'StretchBox/app/src/main/java/com/example/stretchbox/util/RootShell.kt' <<'STRETCH_EOF'
        package com.example.stretchbox.util

        import java.util.concurrent.TimeUnit
        import kotlin.concurrent.thread

        /** 直接用 su 执行命令：只需要 root 授权，不依赖 Binder 服务 */
        object RootShell {
            /** 返回 (退出码, 输出)；超时返回 -1，启动失败返回 -2 */
            fun run(cmd: String, timeoutMs: Long = 8000): Pair<Int, String> {
                return try {
                    val p = ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start()
                    val out = StringBuilder()
                    val reader = thread(isDaemon = true) {
                        try {
                            p.inputStream.bufferedReader().forEachLine { out.append(it).append('\n') }
                        } catch (_: Throwable) {}
                    }
                    if (!p.waitFor(timeoutMs, TimeUnit.MILLISECONDS)) {
                        p.destroy()
                        reader.join(300)
                        return -1 to ("命令超时\n" + out.toString().trim())
                    }
                    reader.join(800)
                    p.exitValue() to out.toString().trim()
                } catch (t: Throwable) {
                    -2 to t.toString()
                }
            }
        }
        STRETCH_EOF
        mkdir -p "$(dirname 'StretchBox/app/src/main/java/com/example/stretchbox/util/CrashReporter.kt')"
        cat > 'StretchBox/app/src/main/java/com/example/stretchbox/util/CrashReporter.kt' <<'STRETCH_EOF'
        package com.example.stretchbox.util
        
        import android.app.ActivityManager
        import android.app.ApplicationExitInfo
        import android.content.Context
        import android.util.Log
        
        /** 记录崩溃堆栈，下次打开时展示；同时检查进程是否被系统异常终止 */
        object CrashReporter {
        
            private const val PREF = "crash"
        
            fun install(context: Context) {
        val sp = context.applicationContext.getSharedPreferences(PREF, Context.MODE_PRIVATE)
        Thread.setDefaultUncaughtExceptionHandler { _, e ->
            try { AppLog.e("Crash", "未捕获异常", e) } catch (_: Throwable) {}
            sp.edit().putString("log", Log.getStackTraceString(e)).commit()
            android.os.Process.killProcess(android.os.Process.myPid())
        }
            }
        
            /** 取出（并清除）上次的异常报告，没有则返回 null */
            fun consumeReport(context: Context): String? {
        val sp = context.applicationContext.getSharedPreferences(PREF, Context.MODE_PRIVATE)
        val crash = sp.getString("log", null)
        if (crash != null) sp.edit().remove("log").apply()
        
        // 只关心异常退出；用户划掉应用之类的正常退出不提示
        var exitText: String? = null
        try {
            val am = context.getSystemService(ActivityManager::class.java)
            val info = am.getHistoricalProcessExitReasons(context.packageName, 0, 1).firstOrNull()
            if (info != null && info.timestamp > sp.getLong("exitTs", 0L)) {
                sp.edit().putLong("exitTs", info.timestamp).apply()
                reasonName(info.reason)?.let { name ->
            AppLog.w("Exit", "上次进程退出：$name status=${info.status} ${info.description ?: ""}")
                    exitText = "退出原因：$name（status=${info.status}）\n${info.description ?: ""}"
                }
            }
        } catch (_: Throwable) {
        }
        
        return when {
            crash != null -> crash.take(4000)
            else -> exitText
        }
            }
        
            private fun reasonName(reason: Int): String? = when (reason) {
        ApplicationExitInfo.REASON_CRASH -> "应用崩溃"
        ApplicationExitInfo.REASON_CRASH_NATIVE -> "原生崩溃"
        ApplicationExitInfo.REASON_ANR -> "无响应 (ANR)"
        ApplicationExitInfo.REASON_LOW_MEMORY -> "内存不足被系统回收"
        ApplicationExitInfo.REASON_EXCESSIVE_RESOURCE_USAGE -> "资源占用过高被系统终止"
        ApplicationExitInfo.REASON_INITIALIZATION_FAILURE -> "初始化失败"
        else -> null
            }
        }
        STRETCH_EOF
