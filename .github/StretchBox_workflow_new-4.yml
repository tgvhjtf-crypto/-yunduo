    - name: Publish release (direct download link)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # 标签带上运行序号、重试次数和提交号，避免与已有 Release 重名
        TAG="build-${{ github.run_number }}-${{ github.run_attempt }}-${GITHUB_SHA::7}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          # 万一同名 Release 已存在：直接覆盖上传，不再报错
          gh release upload "$TAG" StretchBox.apk --clobber
        else
          gh release create "$TAG" StretchBox.apk \
            --title "云朵工具箱 $TAG" \
            --notes "commit ${GITHUB_SHA::7}" \
            --latest
        fi
        {
          echo "### 下载链接"
          echo "- 本次构建：https://github.com/${{ github.repository }}/releases/download/$TAG/StretchBox.apk"
          echo "- 永远最新：https://github.com/${{ github.repository }}/releases/latest/download/StretchBox.apk"
          echo "- 网盘（UC 网盘）：https://drive.uc.cn/s/b98ca6a4cab14?public=1"
        } | tee -a "$GITHUB_STEP_SUMMARY"
