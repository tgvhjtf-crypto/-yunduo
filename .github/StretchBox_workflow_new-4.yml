        private class LiveState(
            val battery: List<Pair<String, String>> = emptyList(),
            val cpu: List<Pair<String, String>> = emptyList(),
            val thermal: List<Pair<String, String>> = emptyList(),
            val needService: Boolean = false,
        )

        /** 采样器：电池用系统接口；CPU / GPU / 温度通过 Shizuku(shell) 读 /proc、/sys */
        private class Sampler(private val ctx: Context) {
            private var lastTotal = 0L
            private var lastIdle = 0L
            private var gpuPath: String? = null
            private var zones: List<Pair<String, String>>? = null

            fun sample(): LiveState {
                val battery = battery()
                val svc = ServiceClient.service ?: return LiveState(battery = battery, needService = true)
                val read: (String) -> String = { p -> try { svc.readFile(p) } catch (_: Throwable) { "" } }

                val cpu = ArrayList<Pair<String, String>>()
                cpuUsage(read)?.let { cpu.add("CPU 占用" to "$it%") }
                gpuUsage(read)?.let { cpu.add("GPU 占用" to "$it%") }
                read("/sys/class/kgsl/kgsl-3d0/gpuclk").trim().toLongOrNull()?.let { cpu.add("GPU 频率" to "${it / 1000000} MHz") }
                val n = Runtime.getRuntime().availableProcessors()
                val freqs = (0 until n).map { i ->
                    read("/sys/devices/system/cpu/cpu$i/cpufreq/scaling_cur_freq").trim().toLongOrNull()?.let { "${it / 1000}" } ?: "-"
                }
                cpu.add("核心频率 (MHz)" to freqs.joinToString("  "))

                val z = zones ?: scanZones(read).also { if (it.isNotEmpty()) zones = it }
                val thermal = z.mapNotNull { (type, path) ->
                    read(path).trim().toLongOrNull()?.let { type to tempText(it) }
                }
                return LiveState(battery, cpu, thermal)
            }

            private fun battery(): List<Pair<String, String>> {
                val b = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED)) ?: return emptyList()
                val level = b.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                val scale = b.getIntExtra(BatteryManager.EXTRA_SCALE, 100).coerceAtLeast(1)
                val status = when (b.getIntExtra(BatteryManager.EXTRA_STATUS, -1)) {
                    BatteryManager.BATTERY_STATUS_CHARGING -> "充电中"
                    BatteryManager.BATTERY_STATUS_FULL -> "已充满"
                    BatteryManager.BATTERY_STATUS_DISCHARGING -> "放电中"
                    BatteryManager.BATTERY_STATUS_NOT_CHARGING -> "未充电"
                    else -> "未知"
                }
                val plugged = when (b.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0)) {
                    BatteryManager.BATTERY_PLUGGED_AC -> "交流"
                    BatteryManager.BATTERY_PLUGGED_USB -> "USB"
                    BatteryManager.BATTERY_PLUGGED_WIRELESS -> "无线"
                    else -> "未接入"
                }
                val health = when (b.getIntExtra(BatteryManager.EXTRA_HEALTH, 0)) {
                    BatteryManager.BATTERY_HEALTH_GOOD -> "良好"
                    BatteryManager.BATTERY_HEALTH_OVERHEAT -> "过热"
                    BatteryManager.BATTERY_HEALTH_DEAD -> "损坏"
                    BatteryManager.BATTERY_HEALTH_OVER_VOLTAGE -> "过压"
                    BatteryManager.BATTERY_HEALTH_COLD -> "过冷"
                    else -> "未知"
                }
                val vRaw = b.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0).toDouble()
                val volt = if (vRaw > 100) vRaw / 1000.0 else vRaw
                val temp = b.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) / 10.0
                var cur = ctx.getSystemService(BatteryManager::class.java)
                    .getLongProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW).toDouble()
                if (abs(cur) >= 20000) cur /= 1000.0
                val watt = if (cur == 0.0 || volt == 0.0) null else abs(cur) / 1000.0 * volt
                return listOf(
                    "电量" to "${level * 100 / scale}%（$status）",
                    "电源" to plugged,
                    "电压" to "%.2f V".format(volt),
                    "电流" to if (cur == 0.0) "--" else "%.0f mA".format(abs(cur)),
                    "功率" to (watt?.let { "%.2f W".format(it) } ?: "--"),
                    "温度" to "%.1f ℃".format(temp),
                    "健康" to health,
                )
            }

            private fun cpuUsage(read: (String) -> String): Int? {
                val line = read("/proc/stat").lineSequence().firstOrNull { it.startsWith("cpu ") } ?: return null
                val p = line.trim().split(Regex("\\s+")).drop(1).mapNotNull { it.toLongOrNull() }
                if (p.size < 5) return null
                val idle = p[3] + p[4]
                val total = p.sum()
                val dT = total - lastTotal
                val dI = idle - lastIdle
                val first = lastTotal == 0L
                lastTotal = total
                lastIdle = idle
                if (first || dT <= 0) return null
                return ((dT - dI) * 100 / dT).toInt().coerceIn(0, 100)
            }

            private fun gpuUsage(read: (String) -> String): Int? {
                for (path in gpuPath?.let { listOf(it) } ?: GPU_PATHS) {
                    val txt = read(path)
                    val nums = Regex("\\d+").findAll(txt).map { it.value.toLong() }.toList()
                    if (nums.isEmpty()) continue
                    val v = if (path.endsWith("gpubusy") && nums.size >= 2) {
                        if (nums[1] <= 0) continue
                        nums[0] * 100 / nums[1]
                    } else nums[0]
                    if (v in 0..100) {
                        gpuPath = path
                        return v.toInt()
                    }
                }
                return null
            }

            private fun scanZones(read: (String) -> String): List<Pair<String, String>> {
                val all = ArrayList<Pair<String, String>>()
                var miss = 0
                for (z in 0 until 100) {
                    val type = read("/sys/class/thermal/thermal_zone$z/type").trim()
                    if (type.isEmpty()) {
                        miss++
                        if (miss >= 6) break
                        continue
                    }
                    miss = 0
                    all.add(type to "/sys/class/thermal/thermal_zone$z/temp")
                }
                val re = Regex("cpu|gpu|batt|skin|soc|shell|case|pa-therm|xo", RegexOption.IGNORE_CASE)
                val pick = all.filter { re.containsMatchIn(it.first) }
                return (if (pick.isNotEmpty()) pick else all).take(8)
            }

            private fun tempText(raw: Long): String {
                val c = when {
                    raw >= 1000 -> raw / 1000.0
                    raw >= 200 -> raw / 10.0
                    else -> raw.toDouble()
                }
                return "%.1f ℃".format(c)
            }

            companion object {
                private val GPU_PATHS = listOf(
                    "/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage",
                    "/sys/class/kgsl/kgsl-3d0/gpubusy",
                    "/sys/class/misc/mali0/device/utilisation",
                    "/sys/kernel/gpu/gpu_busy",
                    "/sys/kernel/ged/hal/gpu_utilization",
                )
            }
        }

        private fun staticInfo(ctx: Context): List<Pair<String, String>> {
            val dm = ctx.getSystemService(DisplayManager::class.java)
            val d = dm.getDisplay(Display.DEFAULT_DISPLAY)
            val m = d?.mode
            val maxHz = d?.supportedModes?.maxOfOrNull { it.refreshRate } ?: 0f
            val am = ctx.getSystemService(ActivityManager::class.java)
            val mi = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
            val gb = 1024.0 * 1024 * 1024
            val st = StatFs(Environment.getDataDirectory().path)
            val soc = if (Build.VERSION.SDK_INT >= 31) Build.SOC_MODEL else Build.HARDWARE
            return listOf(
                "设备" to "${Build.MANUFACTURER} ${Build.MODEL}",
                "处理器" to "$soc · ${Runtime.getRuntime().availableProcessors()} 核",
                "Android" to "${Build.VERSION.RELEASE}（API ${Build.VERSION.SDK_INT}）",
                "系统版本" to Build.DISPLAY,
                "内核" to (System.getProperty("os.version") ?: "-"),
                "架构" to (Build.SUPPORTED_ABIS.firstOrNull() ?: "-"),
                "屏幕" to "${m?.physicalWidth}×${m?.physicalHeight} · ${ctx.resources.displayMetrics.densityDpi}dpi · ${d?.refreshRate?.toInt()}Hz（最高 ${maxHz.toInt()}Hz）",
                "内存" to "%.1f / %.1f GB 可用".format(mi.availMem / gb, mi.totalMem / gb),
                "存储" to "%.1f / %.1f GB 可用".format(st.availableBytes / gb, st.totalBytes / gb),
            )
        }

