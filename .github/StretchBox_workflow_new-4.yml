        package com.example.stretchbox.shizuku
        
        import android.content.ComponentName
        import android.content.Context
        import android.content.ServiceConnection
        import android.content.pm.PackageManager
        import android.os.IBinder
        import com.example.stretchbox.IStretchService
        import com.example.stretchbox.service.RootMain
        import com.example.stretchbox.service.StretchService
        import com.example.stretchbox.util.AppLog
        import rikka.shizuku.Shizuku
        import java.util.concurrent.CopyOnWriteArrayList
        import kotlin.concurrent.thread
        
        /** App 进程侧：管理 Shizuku 授权 & UserService 的绑定 */
        object ServiceClient {
        
            enum class Status { SHIZUKU_NOT_RUNNING, NO_PERMISSION, READY, ROOT_READY }
        
            /** 是否检测到可用的 root（su 存在且能拿到 root shell） */
            @Volatile private var rootAvailable = false

