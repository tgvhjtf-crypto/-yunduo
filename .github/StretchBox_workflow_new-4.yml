            @Volatile var rootMode = false
                private set
        
            /** Shizuku 服务端版本号，取不到返回 -1 */
            fun serverVersion(): Int = try { Shizuku.getVersion() } catch (_: Throwable) { -1 }
        
            /** Shizuku 运行身份：Root / ADB，取不到返回 null */
            fun runMode(): String? = try {
        when (val uid = Shizuku.getUid()) {
            0 -> "Root"
            2000 -> "ADB"
            else -> "uid $uid"
        }
            } catch (_: Throwable) {
        null
            }
        
            fun requestPermission() {
        try { Shizuku.requestPermission(REQ_CODE) } catch (_: Throwable) {}
            }
        
