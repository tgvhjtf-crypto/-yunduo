        private val ADJUST_NAMES = listOf("明度", "对比度", "饱和度", "色温")

        /** “画面”页：分辨率增强、帧率、画面调节、滤镜、翻转 */
        @Composable
        fun DisplayScreen(settings: Settings, modifier: Modifier = Modifier) {
            AdaptiveColumn(
            modifier = modifier
                .verticalScroll(rememberScrollState())
                .padding(horizontal = 16.dp, vertical = 8.dp),
        ) {
                AppCard {
                    val ctx = LocalContext.current
                    SectionTitle("Root 直改比例")
                    SwitchRow(
                        title = "启用",
                        summary = "只需要 su 授权，不依赖 Root 服务。用 Root 启动时，直接修改系统显示比例再启动游戏，不经过虚拟屏：没有额外合成，帧率和延迟与原生一致，短边保持原生清晰度；游戏退出后自动恢复。下面的“增强分辨率”“画面调节”只对虚拟屏（Shizuku）模式生效",
                        checked = settings.ratioMode,
                        onCheckedChange = { settings.ratioMode = it },
                    )
                    ChipRow(
                        items = RatioMath.PRESETS.mapIndexed { i, t -> i to t.first } + (RatioMath.CUSTOM_IDX to "自定义"),
                        isSelected = { it.first == settings.ratioIdx },
                        label = { it.second },
                        onClick = { settings.ratioIdx = it.first },
                    )
                    if (settings.ratioIdx >= RatioMath.CUSTOM_IDX) {
                        SliderRow(
                            title = "自定义宽高比",
                            valueText = "%.2f : 1".format(settings.ratioCustom),
                            value = settings.ratioCustom,
                            onValueChange = { settings.ratioCustom = it },
                            valueRange = 1.0f..2.6f,
                        )
                    }
                    val nat = RatioMath.nativeSize(ctx)
                    if (nat != null) {
                        val plan = RatioMath.plan(nat.first, nat.second, settings.ratioValue())
                        HintText("原生 ${nat.first}×${nat.second} → 实际 ${plan.w}×${plan.h}")
                    }
                    HintText("如果画面异常或游戏闪退后比例没恢复，点下面的按钮；也可在终端执行 wm size reset")
