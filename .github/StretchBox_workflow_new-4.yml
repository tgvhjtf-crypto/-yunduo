            it.surface = surface
            it.resize(width, height, dpi)
            return it.display.displayId
        }
        val dm = displayManager ?: throw IllegalStateException(initError ?: "DisplayManager 不可用")
        
        var flags = FLAG_PUBLIC or FLAG_OWN_CONTENT_ONLY or FLAG_SUPPORTS_TOUCH or
                FLAG_DESTROY_CONTENT_ON_REMOVAL
        if (Build.VERSION.SDK_INT >= 33) {
            flags = flags or FLAG_TRUSTED or FLAG_OWN_DISPLAY_GROUP or FLAG_ALWAYS_UNLOCKED or FLAG_OWN_FOCUS
        }
        
        if (rotatesWithContent) flags = flags or FLAG_ROTATES_WITH_CONTENT
        
        val d = createWithRefreshRate(dm, width, height, dpi, refreshRate, surface, flags)
            ?: dm.createVirtualDisplay("StretchBox", width, height, dpi, surface, flags)
            ?: throw IllegalStateException("createVirtualDisplay 返回 null")
